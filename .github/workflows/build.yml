name: Build

on:
 - push
 - pull_request
 # You can manually run this workflow.
 - workflow_dispatch

# improve CI concurrency by automatically cancelling outdated jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

# ---------------------------------------------------------------------------------------

  build-on-windows:

# ---------------------------------------------------------------------------------------

    name: ${{ matrix.config.job_name }}

    # https://github.com/actions/runner-images#available-environments
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md        VC17
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md        VC17
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-VS2026-Readme.md VC18
    runs-on: ${{ matrix.config.OS }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # Compiler Versions Overview for Github Actions Windows Images (01-2024)
          # ----------------------------------------------------------------------
          # OS↓ Compiler->       | VC    | Clang-Cl | GNU C++ | LLVM Clang
          # ---------------------|-------|----------|---------|--------------------------
          #  windows-2019        | 16.11 |          | 8.1.0   | 16.0.6
          #  windows-2022        | 17.8  |          | 12.2.0  | 16.0.6
          #  windows-2025        | 17.12 |          | 14.2.0  | 19.1.5
          #  windows-2025-vs2026 | 18.3  | 18.3     |         | 20.1.8
          #- { os: windows-2019, preset: "vc16-x64-windows-static-rel", job_name: "Win | VC-16 | Release"        }
          #- { os: windows-2022, preset: "vc17-x64-windows-static-rel", job_name: "Win | VC-17 | Release"        }
          #- { os: windows-2022, preset: "vc17-x64-windows-static-rdi", job_name: "Win | VC-17 | RelWithDebInfo" }
          - { os: windows-2025, preset: "vc17-x64-windows-static-rel", job_name: "Win | VC-17 | Release"        }
          - { os: windows-2025, preset: "vc17-x64-windows-static-rdi", job_name: "Win | VC-17 | RelWithDebInfo" }
          - { os: windows-2025-vs2026, preset: "vc18-x64-windows-static-rel", job_name: "Win | VC-18 | Release" }
          - { os: windows-2025-vs2026, preset: "vc18-x64-windows-static-rdi", job_name: "Win | VC-18 | RelWithDebInfo" }

    env:
      # We can not set VCPKG_ROOT here, because its redefined by action "ilammy/msvc-dev-cmd@1".
      #VCPKG_ROOT: C:\vcpkg
      VCPKG_DISABLE_METRICS: 1

    defaults:
      run:
        shell: cmd

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      # https://community.chocolatey.org/packages/ccache
      #- name: 🔽 Install ccache
      #  run: choco install ccache --no-progress

      # https://community.chocolatey.org/packages/ninja
      - name: 🔽 Install Ninja
        run: choco install ninja --no-progress

      # https://community.chocolatey.org/packages/cmake
      - name: 🔽 Install CMake
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --apply-install-arguments-to-dependencies --no-progress

      # Build Artifact Name: wiuc-1.0.1-0cda6a2-vc17-x64-win
      - name: ✏ Fetch Versioning Data & Set Artifact Name
        shell: pwsh
        run: |
          $NAME='wiuc'
          $VERSION=$(jq -r .version vcpkg.json)
          $SHORT_HASH=$($env:GITHUB_SHA.substring(0,7))
          $PRESET=$('${{ matrix.config.preset }}').replace('-windows-static', '-win').replace('-rel', '')
          $ARTIFACT_NAME="$NAME-$VERSION-$SHORT_HASH-$PRESET"
          echo "Artifact Name:" $ARTIFACT_NAME
          echo "ARTIFACT_NAME=$($ARTIFACT_NAME)" >> $env:GITHUB_ENV
          echo "VERSION=$($VERSION)" >> $env:GITHUB_ENV

      # WARNING
      # ENV VCPKG_ROOT is redefined by this action
      # and set to "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg"
      # instead of "c:\vcpkg", which is important for the pre-installed VCPKG on GHA.
      - name: 🛠️ Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # Default Location is "c:\vcpkg"
      - name: 🔽 Define VCPKG_ROOT
        shell: pwsh
        run: |
          $VCPKG_ROOT=$($env:VCPKG_INSTALLATION_ROOT)
          echo "VCPKG_ROOT=$($VCPKG_ROOT)" >> $env:GITHUB_ENV

      # Reminder: This step requires that the CMakePresets for CI contain
      # "CMAKE_CXX_COMPILER_LAUNCHER": "sccache".
      - name: 🎯 Setup Build Cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: build-${{ matrix.config.preset }}-${{ github.ref }}
          restore-keys: |
            build-${{ matrix.config.preset }}-${{ github.ref }}
            build-${{ matrix.config.preset }}

      - name: 🎯 Setup VCPKG Cache
        id: cache-vcpkg
        uses: actions/cache@v6 # https://github.com/actions/cache
        with:
          # https://github.com/microsoft/vcpkg/blob/master/docs/users/binarycaching.md#configuration
          path: |
            ${{ env.VCPKG_ROOT }}\packages
            ~\AppData\Local\vcpkg\archives\
          key: cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}
          restore-keys: |
            cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}
            cache-vcpkg-${{ matrix.config.preset }}

      - name: 🔽 Update VCPKG to latest TAG
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ env.VCPKG_ROOT }}"
          git fetch --tags
          LATEST_VCPKG_TAG=$(git describe --tags --abbrev=0)
          git checkout $LATEST_VCPKG_TAG

      - name: 🔽 Bootstrap + Integrate VCPKG
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          bootstrap-vcpkg.bat
          vcpkg integrate

      - name: ✏ CMake ➔ Configure
        run: cmake --preset=${{ matrix.config.PRESET }}

      - name: 🙏 CMake ➔ Build
        run: cmake --build --preset=${{ matrix.config.PRESET }}

      - name: 📦 CMake ➔ Install
        run: cmake --install out/build/${{ matrix.config.PRESET }} --verbose

      - name: ❔ CHECK important folders, to see if everything is present (after building)
        run: |
          dir /S /B out\build\${{ matrix.config.preset }}
          dir /S /B out\install

      - name: 🚥 Prepare Build Artifact (copy to packaging folder and rename)
        run: |
          mkdir artifact
          xcopy /E out\install\${{ matrix.config.preset }} artifact

      - name: 🔼 Upload Build Artifact (on commit)
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        if: always()
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/**/*

# ---------------------------------------------------------------------------------------

  build-on-linux:

# ---------------------------------------------------------------------------------------

    name: ${{ matrix.config.job_name }}

    # https://github.com/actions/runner-images#available-environments
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    # https://github.com/actions/partner-runner-images/blob/main/images/arm-ubuntu-24-image.md
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
        # Compiler Versions Overview for Github Actions Linux Images (01-2024)
        # ----------------------------------------------------------------------------------
        # OS↓ Compiler->     | GNU C++            | LLVM Clang            | Deprecation
        # -------------------|--------------------|-----------------------|-----------------
        # ubuntu-20.04       | 9, 10              | 10, 11, 12            | 2025-04
        # ubuntu-22.04       | 9, 10, 11, 12      | 13, 14, 15            | 2026-09
        # ubuntu-24.04       | 12, 13, 14         | 16, 17, 18 (default)  |
        # ubuntu-26.04       | 13, 14, 15         | 20, 21, 22            |
        # ubuntu-22.04-arm64 | 9, 10, 11, 12, 13  | 14, 15                | 2026-09
        # ubuntu-24.04-arm64 | 12, 13, 14         | 16, 17, 18 (default)  |
        # ubuntu-26.04-arm64 | 12, 13, 14         | 20, 21, 22            |
        - { os: ubuntu-24.04, preset: "gcc13-x64-linux-rel",   apt_packages: "g++-13",   job_name: "Linux | GCC-13   | Release" }
        - { os: ubuntu-26.04, preset: "gcc15-x64-linux-rel",   apt_packages: "g++-15",   job_name: "Linux | GCC-15   | Release" }
        - { os: ubuntu-24.04, preset: "clang18-x64-linux-rel", apt_packages: "clang-18", job_name: "Linux | Clang-18 | Release" }
        # Clang-22 is built by the "build-on-container" job (cpp-devbox image) instead of
        # here. Building it in both jobs produced an identical ARTIFACT_NAME, which
        # actions/upload-artifact rejects as a duplicate within one workflow run.
        # ARM
        #- { os: ubuntu-22.04-arm64, preset: "gcc14-linux-rel", apt_packages: "g++-14", job_name: "Linux ARM64 | GCC-14 | Release" }
        #- { os: ubuntu-24.04-arm64, preset: "gcc14-linux-rel", apt_packages: "g++-14", job_name: "Linux ARM64 | GCC-14 | Release" }

    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_DISABLE_METRICS: 1

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      # Build Artifact Name: wiuc-1.0.1-0cda6a2-clang17-x64-linux
      - name: ✏ Fetch Versioning Data & Set Artifact Name
        run: |
          NAME='wiuc'
          VERSION=$(jq -r .version vcpkg.json)
          SHORT_HASH=`echo $GITHUB_SHA | cut -c1-8`
          PRESET=`echo ${{ matrix.config.preset }} | sed 's/-rel//'`
          ARTIFACT_NAME="$NAME-$VERSION-$SHORT_HASH-$PRESET"
          echo "Artifact Name: $ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # openssl requires Linux kernel headers from the system package manager:
      # linux-libc-dev for openssl, which is fechted and build via vcpkg.
      - name: 🔽 Update Build Environment (update/install packages)
        run: |
          sudo apt update -qq
          sudo apt install linux-libc-dev ninja-build ${{ matrix.config.apt_packages }} -y
          sudo ln -s /usr/bin/ninja /usr/bin/ninja-build

      # Reminder: This step requires that the CMakePresets for CI contain
      # "CMAKE_CXX_COMPILER_LAUNCHER": "sccache".
      - name: 🎯 Setup Build Cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: build-${{ matrix.config.preset }}-${{ github.ref }}
          restore-keys: |
            build-${{ matrix.config.preset }}-${{ github.ref }}
            build-${{ matrix.config.preset }}

      - name: 🎯 Cache VCPKG
        id: cache-vcpkg
        uses: actions/cache@v6 # https://github.com/actions/cache
        with:
          # https://github.com/microsoft/vcpkg/blob/master/docs/users/binarycaching.md#configuration
          path: /home/runner/.cache/vcpkg/archives/
          key: cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}
          restore-keys: |
            cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}
            cache-vcpkg-${{ matrix.config.preset }}

      - name: 🔽 Update VCPKG
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.VCPKG_ROOT }}
          git reset --hard
          git pull --quiet
          ./bootstrap-vcpkg.sh

      - name: ✏ CMake ➔ Configure
        run: cmake --preset=${{ matrix.config.PRESET }}

      - name: 🙏 CMake ➔ Build
        run: cmake --build --preset=${{ matrix.config.PRESET }}

      - name: 📦 CMake ➔ Install
        run: cmake --install out/build/${{ matrix.config.PRESET }} --verbose

      - name: ❔ CHECK important folders, to see if everything is present (after building)
        run: |
          ls out/build/${{ matrix.config.preset }}
          ls out/install/${{ matrix.config.preset }}

      - name: 🚥 Prepare Build Artifact (copy to packaging folder)
        run: |
          mkdir artifact
          cp -r out/install/${{ matrix.config.preset }} artifact/

      #
      # The uploaded artifact will be a zip file named, e.g. "wiuc-1.0.3-2399e873-Clang14-x64-linux-Release".
      # The binary inside the zip is named "wiuc".
      #
      - name: 🔼 Upload Build Artifact (on every commit)
        if: always()
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/**/*

# ---------------------------------------------------------------------------------------

  build-on-container:

# ---------------------------------------------------------------------------------------

    name: ${{ matrix.config.job_name }}

    # Note on "image_version":
    # - The image versions are based on tags of the https://github.com/jakoch/cpp-devbox repo.
    # - Use rolling tags (e.g., "trixie-latest") for bleeding-edge updates,
    #   but expect potential instability due to changes in the included software.
    # - Pin to a fixed version (e.g., "trixie-20260329") for reproducible and stable builds.
    runs-on: ubuntu-latest
    container: ghcr.io/jakoch/cpp-devbox:${{ matrix.config.image_version }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - { job_name: "Linux | Clang-22 | Release",
            image_version: "trixie-latest",
            preset: "clang22-x64-linux-rel"
          }
        - { job_name: "Linux | Clang-22 | Coverage",
            image_version: "trixie-latest",
            preset: "clang22-x64-linux-dbg-cov"
          }

    env:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_DISABLE_METRICS: 1
      # Base of the binary directory, holding compile_commands.json.
      # The presets inherit "build-folders-default", which sets binaryDir to
      # "${sourceDir}/out/build/${presetName}", so the preset name is appended
      # to this at the point of use.
      BUILD_DIR: ${{ github.workspace }}/out/build

    # "id-token: write" is needed by the Codecov upload (OIDC authentication).
    # Scoped to this job, so the other jobs keep the default token permissions.
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      # Build Artifact Name: wiuc-1.0.1-0cda6a2-clang17-x64-linux-rel
      - name: ✏ Fetch Versioning Data & Set Artifact Name
        run: |
          NAME='wiuc'
          VERSION=$(jq -r .version vcpkg.json)
          SHORT_HASH=`echo $GITHUB_SHA | cut -c1-8`
          PRESET=`echo ${{ matrix.config.preset }} | sed 's/-rel//'`
          ARTIFACT_NAME="$NAME-$VERSION-$SHORT_HASH-$PRESET"
          echo "Artifact Name: $ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # openssl requires Linux kernel headers from the system package manager:
      # linux-libc-dev for openssl, which is fechted and build via vcpkg.
      - name: 🔽 Update Build Environment (update/install packages)
        run: |
          sudo apt update -qq
          sudo apt install linux-libc-dev ninja-build -y
          sudo ln -s /usr/bin/ninja /usr/bin/ninja-build

      # Reminder: This step requires that the CMakePresets for CI contain
      # "CMAKE_CXX_COMPILER_LAUNCHER": "sccache".
      - name: 🎯 Setup Build Cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: cache-build-${{ matrix.config.preset }}-${{ github.ref }}
          restore-keys: |
            cache-build-${{ matrix.config.preset }}-${{ github.ref }}
            cache-build-${{ matrix.config.preset }}

      - name: 🎯 Cache VCPKG
        id: cache-vcpkg
        uses: actions/cache@v6 # https://github.com/actions/cache
        with:
          # https://github.com/microsoft/vcpkg/blob/master/docs/users/binarycaching.md#configuration
          path: /home/runner/.cache/vcpkg/archives/
          key: cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}
          restore-keys: |
            cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}
            cache-vcpkg-${{ matrix.config.preset }}

      - name: 🔽 Update VCPKG (latest TAG)
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.VCPKG_ROOT }}
          git fetch origin --tags --force
          git checkout master
          git reset --hard origin/master
          git clean -fdx
          LATEST_VCPKG_TAG="$(git tag --sort=-v:refname | head -n 1)"
          git checkout "$LATEST_VCPKG_TAG"

      - name: 🛠️ Setup VCPKG
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh"
          "${VCPKG_ROOT}/vcpkg" integrate install

      - name: ✏ CMake ➔ Configure
        run: cmake --preset=${{ matrix.config.PRESET }}

      # The unit tests are only built for the coverage run. They pull in the Catch2
      # dependency, which is declared as the optional "tests" feature in vcpkg.json,
      # so a release build does not have to fetch or link it.
      #
      # The build directory is re-used, so the extra -D flags are passed to the very
      # same configure step above and CMake reconfigures in place.
      #
      - name: 🧪 Enable Unit Tests
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: |
          cmake --preset=${{ matrix.config.PRESET }} \
            -DBUILD_TESTS=ON \
            -DVCPKG_MANIFEST_FEATURES=tests

      # The coverage preset compiles with "-fprofile-instr-generate -fcoverage-mapping"
      # (see the "coverage-using-clang" preset). That instrumentation makes every run of
      # an instrumented binary write a .profraw file, and LLVM_PROFILE_FILE decides
      # where it lands. Without this, the files are written to the working directory
      # and end up scattered across the artifact.
      #
      # "%p" expands to the PID, so repeated or parallel runs do not overwrite each other.
      # BUILD_DIR is already absolute, so it must not be prefixed with GITHUB_WORKSPACE.
      #
      - name: ⚙️ Prepare Coverage Environment
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: |
          mkdir -p "${BUILD_DIR}/${{ matrix.config.preset }}/coverage"
          echo "LLVM_PROFILE_FILE=${BUILD_DIR}/${{ matrix.config.preset }}/coverage/%p.profraw" >> "$GITHUB_ENV"

      - name: 🙏 CMake ➔ Build
        run: cmake --build --preset=${{ matrix.config.PRESET }}

      # Build the test binaries themselves. The build preset pins "targets": ["wiuc"],
      # so "cmake --build --preset" does not build the tests, even with BUILD_TESTS=ON.
      # The e2e tests drive the wiuc binary, which the preset build above produced.
      - name: 🧪 Build Unit Tests
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: |
          cmake --build "${BUILD_DIR}/${{ matrix.config.preset }}" \
            --target csv_format_test paths_test convert_fixture_test error_paths_test

      # Run the tests. The coverage run is the only instrumented build, so this is
      # what actually produces the .profraw files that the coverage steps merge.
      # The e2e test spawns wiuc as a subprocess, so that run contributes its own
      # .profraw and is counted normally.
      - name: 🧪 Run Unit Tests
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: ctest --test-dir "${BUILD_DIR}/${{ matrix.config.preset }}" --output-on-failure

      # Static analysis via the .clang-tidy config, which enables
      # "WarningsAsErrors: '*'". This runs on the Clang-22 coverage build only, so that
      # a tidy finding is reported once instead of multiplying across every
      # compiler/platform in the matrix.
      #
      # The log is uploaded as a build artifact for inspection. The step is
      # deliberately non-fatal ("|| true"): the report currently contains
      # pre-existing findings (see version.h and the argv span indexing in main.cpp),
      # so failing here would block every push. Once those are fixed, drop "|| true"
      # to make clang-tidy a gate.
      #
      - name: 🔍 Clang-Tidy
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: |
          run-clang-tidy -p "${BUILD_DIR}/${{ matrix.config.preset }}" \
            -quiet \
            2>&1 | tee clang-tidy.log \
            || true

      - name: 📤 Upload Clang-Tidy log
        if: always() && matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: clang-tidy-${{ matrix.config.preset }}
          path: clang-tidy.log

      # ------------------------------------------------------------------------
      # Code Coverage Steps (only for "clang22-x64-linux-dbg-cov" preset)
      # ------------------------------------------------------------------------

      # The application binary is instrumented as well, but no unit test executes
      # it, so it would contribute no profile data. Run it once to emit a .profraw
      # into the same directory the merge step reads. "--version-only" exercises
      # main() and the argument parsing without touching the network.
      - name: 🏃 Run wiuc for Coverage
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: |
          cd "${BUILD_DIR}/${{ matrix.config.preset }}"
          ./wiuc --version-only

      - name: 🧾 Merge Coverage Data
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: |
          set -euo pipefail
          COVERAGE_DIR="${BUILD_DIR}/${{ matrix.config.preset }}/coverage"
          echo "Merging .profraw files from $COVERAGE_DIR"
          shopt -s nullglob
          profraw_files=("$COVERAGE_DIR"/*.profraw)
          if [ ${#profraw_files[@]} -eq 0 ]; then
            echo "::warning::No .profraw files found. Did the tests run with LLVM_PROFILE_FILE set?"
            exit 0
          fi
          llvm-profdata merge -sparse "${profraw_files[@]}" -o "$COVERAGE_DIR/coverage.profdata"

      - name: 📊 Generate Coverage Reports (lcov + HTML)
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        env:
          COV_EXCLUDE_REGEX: '(vcpkg_installed|build|tests)'
        run: |
          set -euo pipefail
          COVERAGE_DIR="${BUILD_DIR}/${{ matrix.config.preset }}/coverage"

          # Find all instrumented test binaries (ending with "_test" or "_tests") in the build directory.
          mapfile -t BINARIES < <(find "${BUILD_DIR}/${{ matrix.config.preset }}" -maxdepth 3 -type f -executable \( -name "*_test" -o -name "*_tests" \) -print || true)
          if [ ${#BINARIES[@]} -eq 0 ]; then
            echo "::warning::No instrumented binaries found. Skipping llvm-cov."
            exit 0
          fi

          # The application binary does not match the "*_test" pattern above, but it
          # must be passed to llvm-cov as well, otherwise main.cpp and download.cpp
          # are missing from the report entirely. llvm-cov can only report code it
          # has profile data for, which the step above generates by running it.
          #
          # Each binary is passed with its own "-object=" argument. Passing them as
          # positional arguments instead makes llvm-cov report only the files of the
          # first binary, silently dropping main.cpp and download.cpp.
          OBJECT_ARGS=()
          for binary in "${BINARIES[@]}" "${BUILD_DIR}/${{ matrix.config.preset }}/wiuc"; do
            OBJECT_ARGS+=("-object=$binary")
          done

          # Export LCOV report
          llvm-cov export -format=lcov -instr-profile="$COVERAGE_DIR/coverage.profdata" \
            "${OBJECT_ARGS[@]}" --ignore-filename-regex="${COV_EXCLUDE_REGEX}" \
            > "$COVERAGE_DIR/coverage.lcov"

          # Generate HTML report
          #llvm-cov show -format=html -instr-profile="$COVERAGE_DIR/coverage.profdata" \
          # "${OBJECT_ARGS[@]}" --ignore-filename-regex="${COV_EXCLUDE_REGEX}" \
          # -o "$COVERAGE_DIR/html" \

          # Print summary to CI logs for visibility
          llvm-cov report -instr-profile="$COVERAGE_DIR/coverage.profdata" \
            "${OBJECT_ARGS[@]}" --ignore-filename-regex="${COV_EXCLUDE_REGEX}"

      # Note: the artifact name deliberately ends in "-dbg-cov", because the
      # "github-release" job removes every "*-dbg-cov" artifact before publishing.
      - name: 🔼 Upload Coverage Artifact
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: Coverage-Report-${{ matrix.config.preset }}
          path: ${{ env.BUILD_DIR }}/${{ matrix.config.preset }}/coverage/**

      # Codecov authenticates via OIDC, which requires the "id-token: write" permission.
      # It is granted per job below, so that the other jobs keep the default token scope.
      - name: 📦 Upload Coverage to Codecov
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7 # https://github.com/codecov/codecov-action
        with:
          files: ${{ env.BUILD_DIR }}/${{ matrix.config.preset }}/coverage/coverage.lcov
          disable_search: true
          name: ${{ matrix.config.preset }}
          flags: ${{ matrix.config.preset }}
          use_oidc: true
          fail_ci_if_error: true

      - name: 📦 CMake ➔ Install
        run: cmake --install out/build/${{ matrix.config.PRESET }} --verbose

      - name: ❔ CHECK important folders, to see if everything is present (after building)
        run: |
          ls out/build/${{ matrix.config.preset }}
          ls out/install/${{ matrix.config.preset }}

      - name: 🚥 Prepare Build Artifact (copy to packaging folder)
        run: |
          mkdir artifact
          cp -r out/install/${{ matrix.config.preset }} artifact/

      # The uploaded artifact will be a zip file named,
      # e.g. "wiuc-1.0.3-2399e873-Clang14-x64-linux-Release".
      # The binary inside the zip is named "wiuc".
      #
      - name: 🔼 Upload Build Artifact (on every commit)
        if: always()
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/**/*

# ---------------------------------------------------------------------------------------

  github-release:

# ---------------------------------------------------------------------------------------

    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-on-windows
      - build-on-linux
      - build-on-container

    # on tag push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: 🤘 Checkout repository
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      #  This downloads all artifact zip archives and extracts them into folders.
      #  So we have to zip them for release again.... ¯\_(ツ)_/¯
      #  We are waiting for the "extractArtifact" option, referencing:
      #  # https://github.com/actions/download-artifact/issues/143
      #
      - name: 🔽 Download all artifacts from previous jobs
        uses: actions/download-artifact@v8 # https://github.com/actions/download-artifact
      #   with:
      #     extractArtifact: false # not yet available

      - name: Display downloaded files
        run: |
          ls -R

      # Release assets are the Release and RelWithDebInfo builds, i.e. every preset in the
      # build matrix except the coverage build ("-dbg-cov"), which is a local developer
      # artifact. Note that RelWithDebInfo ("-rdi") IS published, e.g.
      # wiuc-1.0.10-vc17-x64-win-rdi.zip, so it must not be filtered out here.
      - name: Delete all non-release artifact folders
        run: |
          rm -rf *-dbg-cov
          ls -R wiuc*

      # zip with -j to only include files of the folder and not the folder itself
      - name: Zip release folders
        run: |
          for dir in ./wiuc*/ ; do zip -jr "${dir%/}.zip" "$dir"; done
          ls -R

      - name: Delete release folders
        run: find . -maxdepth 1 -type d -name 'wiuc*' -exec rm -r {} +

      # The build matrix names its presets "<compiler>-<arch>-<os>[-static][-rel|-rdi|-dbg-cov]".
      # "Fetch Versioning Data & Set Artifact Name" turns a preset into an artifact name by
      # replacing "-windows-static" with "-win" and stripping "-rel", so the extracted folder
      # (and therefore the zip created above) is named:
      #
      #   wiuc-<version>-<commit>-<compiler>-<arch>-<os>[-rdi|-dbg-cov].zip
      #
      # The regexp drops only the commit hash and keeps the rest of the build descriptor
      # verbatim, so new presets need no change here:
      #
      # IN   wiuc-1.1.0-abc1234-clang18-x64-linux.zip
      # OUT  wiuc-1.1.0-clang18-x64-linux.zip
      #
      # IN   wiuc-1.1.0-abc1234-vc18-x64-win-rdi.zip
      # OUT  wiuc-1.1.0-vc18-x64-win-rdi.zip
      #
      - name: Install rename
        run: sudo apt update && sudo apt install -y rename

      - name: Rename zip files using a named group regexp
        env:
          ARTIFACT_REGEXP: '^(?P<name>wiuc)-(?P<version>[\d.]+)-(?P<commit>[\da-f]+)-(?P<build>.+)\.zip$'
          RELEASE_REGEXP: '$+{name}-$+{version}-$+{build}.zip'
        run: |
          for file in *.zip; do (rename "s/$ARTIFACT_REGEXP/$RELEASE_REGEXP/" "$file"); done
          ls -R

      # "rename" exits 0 when the regexp does not match, so a stale regexp silently
      # publishes assets under their internal names and every download by release name
      # 404s. Fail loudly instead.
      - name: Verify release asset names
        run: |
          set -euo pipefail
          ls -1 *.zip
          if ls -1 *.zip | grep -Eq '^wiuc-[0-9]+\.[0-9.]+-[0-9a-f]{7,}-'; then
            echo "::error::release asset names still contain a commit hash - rename step did not match"
            exit 1
          fi
          if ls -1 *.zip | grep -q -- '-dbg-cov'; then
            echo "::error::coverage build must not be published as a release asset"
            ls -1 *.zip | grep -- '-dbg-cov'
            exit 1
          fi

      - name: Extract Release Notes from Changelog
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3 # https://github.com/ffurrer2/extract-release-notes

      - name: 📋 Create Draft Release
        # https://cli.github.com/manual/gh_release_create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: |
          gh release create $TAG --title "Release $TAG" --notes "$RELEASE_NOTES" --draft

      - name: 📦 Create Github Release
        # https://cli.github.com/manual/gh_release_upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $TAG *.zip
